<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="675"
  viewBox="0 0 1200 675"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Telegram AI IT Agent architecture preview</title>
  <desc id="desc">
    Architecture flow from Telegram user input to Gemini planning, safety
    checks, dry-run execution, and JSONL audit logging.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
